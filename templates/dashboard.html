<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - AuthSystem</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>

<body data-theme="{{ theme }}">

    <header class="topbar">
        <a href="{{ url_for('dashboard') }}" class="logo-link">
            <div class="logo">AuthSystem</div>
        </a>

        <div class="topbar-actions">
            <a href="{{ url_for('profile') }}" class="logout-btn">
                My Profile
            </a>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
                <span id="theme-icon" aria-hidden="true">🌙</span>
                <span id="theme-label">Dark mode</span>
            </button>

            <a href="{{ url_for('logout') }}" class="logout-btn">
                Logout
            </a>
        </div>
    </header>


    <main class="dashboard">

        <section class="welcome-card">

            <h1>Welcome, {{ username }}</h1>

            <p class="welcome-text">
                You are successfully logged in to AuthSystem.
            </p>

            <div class="member-info">

                <div class="info-item">

                    <span class="info-label">
                        Member since
                    </span>

                    <span class="info-value">
                        {{ created_at.strftime('%d %B %Y') }}
                    </span>

                </div>

            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>

</html>
