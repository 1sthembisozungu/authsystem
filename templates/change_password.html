<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - AuthSystem</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>

<body data-theme="{{ theme }}">

    <header class="topbar">

        <a href="{{ url_for('dashboard') }}" class="logo-link">
            <div class="logo">AuthSystem</div>
        </a>

        <div class="topbar-actions">
            <a href="{{ url_for('dashboard') }}" class="logout-btn">
                Dashboard
            </a>

            <a href="{{ url_for('profile') }}" class="logout-btn">
                My Profile
            </a>

            <button type="button" id="theme-toggle" class="theme-toggle">
                <span id="theme-icon">🌙</span>
                <span id="theme-label">Dark mode</span>
            </button>

            <a href="{{ url_for('logout') }}" class="logout-btn">
                Logout
            </a>
        </div>

    </header>

    <main class="dashboard">

        <section class="welcome-card">

            <h1>Change Password</h1>

            <p class="welcome-text">
                Update your password to keep your account secure.
            </p>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="flash-messages">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('change_password') }}" method="POST">

                <div class="form-group">
                    <label for="current_password">Current Password</label>

                    <input type="password" id="current_password" name="current_password"
                        placeholder="Enter your current password" required>
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>

                    <input type="password" id="new_password" name="new_password" placeholder="Enter your new password"
                        minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>

                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Confirm your new password" minlength="8" required>
                </div>

                <button type="submit" class="auth-btn">
                    Update Password
                </button>

            </form>

            <div class="auth-footer">
                <a href="{{ url_for('profile') }}">Back to Profile</a>
            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>

</html>
